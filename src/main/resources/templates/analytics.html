<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    .container{max-width:1100px;margin:1rem auto;padding:0 1rem}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:1rem}
    .muted{color:#6b7280;font-size:.9rem}
  </style>
</head>
<body>
  <div th:replace="fragments/nav :: navbar"></div>
  <div class="container">
    <h2>Stock Status</h2>
    <p class="muted">Green = OK, Yellow = Running Out, Red = Out of Stock</p>
    <div class="card">
      <canvas id="stockChart" height="180"></canvas>
    </div>
  </div>

  <script th:inline="javascript">
    const labels = /*[[${labels}]]*/ [];
    const values = /*[[${values}]]*/ [];
    const colors = /*[[${colors}]]*/ [];

    const data = {
      labels: labels,
      datasets: [{
        label: 'Stock Status',
        data: values,
        backgroundColor: colors,
        borderColor: colors,
        borderWidth: 1
      }]
    };

    new Chart(
      document.getElementById('stockChart'),
      {
        type: 'bar',
        data: data,
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { enabled: true }
          },
          scales: {
            y: { display: false, suggestedMax: 1 },
            x: { ticks: { autoSkip: false, maxRotation: 45, minRotation: 0 } }
          }
        }
      }
    );
  </script>
</body>
</html>
