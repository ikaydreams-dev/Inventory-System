<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories — StockBox</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="fragments/nav :: navbar"></div>
<div class="page-body">
  <div class="page-header">
    <div>
      <div class="page-title">Categories</div>
      <div class="page-sub">Organise items by category</div>
    </div>
    <a class="btn btn-primary" th:href="@{/categories/new}">+ New Category</a>
  </div>

  <div class="table-card">
    <div class="table-card-head">
      <span class="table-card-title">Category List</span>
    </div>
    <table class="dt">
      <thead>
        <tr>
          <th>Name</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="c : ${categories}">
          <td><strong th:text="${c.name}"></strong></td>
          <td th:text="${c.description}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(categories)}">
          <td colspan="2" style="text-align:center;padding:32px;color:var(--muted);">No categories yet. <a th:href="@{/categories/new}" style="color:var(--accent);">Add one.</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
