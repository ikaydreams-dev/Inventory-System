<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Category — StockBox</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="fragments/nav :: navbar"></div>
<div class="page-body">
  <div class="page-header">
    <div>
      <div class="page-title">New Category</div>
      <div class="page-sub">Add a new item category</div>
    </div>
    <a class="btn btn-ghost" th:href="@{/categories}">&#8592; Back</a>
  </div>

  <div class="form-card">
    <form th:action="@{/categories}" th:object="${category}" method="post">
      <div class="form-group">
        <label class="fl">Name *</label>
        <input class="fi" type="text" th:field="*{name}" placeholder="Category name" required autofocus>
      </div>
      <div class="form-group">
        <label class="fl">Description</label>
        <input class="fi" type="text" th:field="*{description}" placeholder="Optional description">
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" type="submit">Save Category</button>
        <a class="btn btn-ghost" th:href="@{/categories}">Cancel</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
