<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Item</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>
<body class="section">
<div th:replace="fragments/nav :: navbar"></div>
<div class="container">
    <h1 class="title">New Item</h1>
    <form th:action="@{/items}" th:object="${item}" method="post">
        <div class="field">
            <label class="label">SKU (auto)</label>
            <div class="control">
                <input class="input" type="text" th:field="*{sku}" placeholder="Auto-generated after save" readonly>
            </div>
        </div>
        <div class="field">
            <label class="label">Name</label>
            <div class="control">
                <input class="input" type="text" th:field="*{name}" required>
            </div>
        </div>
        <div class="field">
            <label class="label">Category</label>
            <div class="control">
                <div class="select is-fullwidth">
                    <select th:field="*{category.id}" required>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                    </select>
                </div>
            </div>
        </div>
        <div class="field">
            <label class="label">Supplier</label>
            <div class="control">
                <div class="select is-fullwidth">
                    <select th:field="*{supplier.id}" required>
                        <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}"></option>
                    </select>
                </div>
            </div>
        </div>
        <div class="field">
            <label class="label">Unit</label>
            <div class="control">
                <input class="input" type="text" th:field="*{unit}">
            </div>
        </div>
        <div class="field">
            <label class="label">Reorder Level</label>
            <div class="control">
                <input class="input" type="number" min="0" th:field="*{reorderLevel}">
            </div>
        </div>
        <div class="field">
            <label class="label">Max Level</label>
            <div class="control">
                <input class="input" type="number" min="0" th:field="*{maxLevel}">
            </div>
        </div>
        <div class="field is-grouped">
            <div class="control">
                <button class="button is-link" type="submit">Save</button>
            </div>
            <div class="control">
                <a class="button is-light" href="/items">Cancel</a>
            </div>
        </div>
    </form>
</div>
</body>
</html>
