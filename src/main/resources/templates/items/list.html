<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Items</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>
<body class="section">
<div th:replace="fragments/nav :: navbar"></div>
<div class="container">
    <h1 class="title">Items</h1>
    <div class="buttons">
        <a class="button is-primary" href="/items/new">New Item</a>
        <a class="button" href="/">Home</a>
    </div>
    <table class="table is-fullwidth is-striped">
        <thead>
        <tr>
            <th>SKU</th>
            <th>Name</th>
            <th>Category</th>
            <th>Supplier</th>
            <th>On Hand</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="i : ${items}">
            <td th:text="${i.sku}">SKU</td>
            <td th:text="${i.name}">Name</td>
            <td th:text="${i.category.name}">Category</td>
            <td>
                <span th:text="${i.supplier.name}">Supplier</span>
                <div class="is-size-7" th:text="${i.supplier.phone}">Phone</div>
                <div class="is-size-7" th:text="${i.supplier.email}">Email</div>
            </td>
            <td th:text="${stocks[i.id]}">0</td>
            <td>
                <span class="tag" th:classappend="${status[i.id]}=='LOW' ? ' is-danger' : (${status[i.id]}=='HIGH' ? ' is-warning' : ' is-success')"
                      th:text="${status[i.id]}">OK</span>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
