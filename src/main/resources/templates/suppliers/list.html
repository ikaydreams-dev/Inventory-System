<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suppliers — StockBox</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="fragments/nav :: navbar"></div>
<div class="page-body">
  <div class="page-header">
    <div>
      <div class="page-title">Suppliers</div>
      <div class="page-sub">Manage your supplier contacts</div>
    </div>
    <a class="btn btn-primary" th:href="@{/suppliers/new}">+ New Supplier</a>
  </div>

  <div class="table-card">
    <div class="table-card-head">
      <span class="table-card-title">Supplier List</span>
    </div>
    <table class="dt">
      <thead>
        <tr>
          <th>Name</th>
          <th>Contact Person</th>
          <th>Phone</th>
          <th>Email</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="s : ${suppliers}">
          <td><strong th:text="${s.name}"></strong></td>
          <td th:text="${s.contactName}"></td>
          <td th:text="${s.phone}"></td>
          <td th:text="${s.email}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(suppliers)}">
          <td colspan="4" style="text-align:center;padding:32px;color:var(--muted);">No suppliers yet. <a th:href="@{/suppliers/new}" style="color:var(--accent);">Add one.</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
