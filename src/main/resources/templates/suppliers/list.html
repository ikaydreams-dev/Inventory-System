<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Suppliers</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>
<body class="section">
<div th:replace="fragments/nav :: navbar"></div>
<div class="container">
    <h1 class="title">Suppliers</h1>
    <div class="buttons">
        <a class="button is-primary" href="/suppliers/new">New Supplier</a>
        <a class="button" href="/">Home</a>
    </div>
    <table class="table is-fullwidth is-striped">
        <thead>
        <tr>
            <th>Name</th>
            <th>Contact</th>
            <th>Phone</th>
            <th>Email</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${suppliers}">
            <td th:text="${s.name}">Name</td>
            <td th:text="${s.contactName}">Contact</td>
            <td th:text="${s.phone}">Phone</td>
            <td th:text="${s.email}">Email</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
