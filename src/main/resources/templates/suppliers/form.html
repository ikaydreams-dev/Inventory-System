<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Supplier — StockBox</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="fragments/nav :: navbar"></div>
<div class="page-body">
  <div class="page-header">
    <div>
      <div class="page-title">New Supplier</div>
      <div class="page-sub">Add a new supplier</div>
    </div>
    <a class="btn btn-ghost" th:href="@{/suppliers}">&#8592; Back</a>
  </div>

  <div class="form-card">
    <form th:action="@{/suppliers}" th:object="${supplier}" method="post">
      <div class="form-row">
        <div class="form-group">
          <label class="fl">Company Name *</label>
          <input class="fi" type="text" th:field="*{name}" placeholder="Supplier company name" required autofocus>
        </div>
        <div class="form-group">
          <label class="fl">Contact Person</label>
          <input class="fi" type="text" th:field="*{contactName}" placeholder="Contact name">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="fl">Phone</label>
          <input class="fi" type="text" th:field="*{phone}" placeholder="+1 555 000 0000">
        </div>
        <div class="form-group">
          <label class="fl">Email</label>
          <input class="fi" type="email" th:field="*{email}" placeholder="contact@supplier.com">
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" type="submit">Save Supplier</button>
        <a class="btn btn-ghost" th:href="@{/suppliers}">Cancel</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
