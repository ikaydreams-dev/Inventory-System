<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>
<body class="section">
<div class="container" style="max-width: 480px;">
    <h1 class="title">Login</h1>

    <div th:if="${param.error}" class="notification is-danger">Invalid email or password.</div>
    <div th:if="${param.logout}" class="notification is-info">You have been logged out.</div>
    <div th:if="${success}" class="notification is-success" th:text="${success}"></div>

    <form th:action="@{/login}" method="post">
        <div class="field">
            <label class="label">Email</label>
            <div class="control">
                <input class="input" type="email" name="email" placeholder="email@example.com" required>
            </div>
        </div>
        <div class="field">
            <label class="label">Password</label>
            <div class="control">
                <input class="input" type="password" name="password" placeholder="Password" required>
            </div>
        </div>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="field is-grouped is-justify-content-space-between">
            <div class="control">
                <button class="button is-link" type="submit">Login</button>
            </div>
            <div class="control">
                <a class="button is-text" th:href="@{/register}">Register</a>
            </div>
        </div>
    </form>
</div>
</body>
</html>
