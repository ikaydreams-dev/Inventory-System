<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Customer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>
<body class="section">
<div th:replace="fragments/nav :: navbar"></div>
<div class="container">
    <h1 class="title">New Customer</h1>
    <form th:action="@{/customers}" th:object="${customer}" method="post">
        <div class="field">
            <label class="label">Name</label>
            <div class="control">
                <input class="input" type="text" th:field="*{name}" required>
            </div>
        </div>
        <div class="field">
            <label class="label">Size</label>
            <div class="control">
                <div class="select is-fullwidth">
                    <select th:field="*{size}" required>
                        <option th:each="s : ${sizes}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
            </div>
        </div>
        <div class="field">
            <label class="label">Phone</label>
            <div class="control">
                <input class="input" type="text" th:field="*{phone}">
            </div>
        </div>
        <div class="field">
            <label class="label">Email</label>
            <div class="control">
                <input class="input" type="email" th:field="*{email}">
            </div>
        </div>
        <div class="field is-grouped">
            <div class="control">
                <button class="button is-link" type="submit">Save</button>
            </div>
            <div class="control">
                <a class="button is-light" href="/customers">Cancel</a>
            </div>
        </div>
    </form>
</div>
</body>
</html>
