<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stores — StockBox</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="fragments/nav :: navbar"></div>
<div class="page-body">
  <div class="page-header">
    <div>
      <div class="page-title">Stores</div>
      <div class="page-sub">Retail stores that receive stock</div>
    </div>
    <a class="btn btn-primary" th:href="@{/customers/new}">+ New Store</a>
  </div>

  <div class="table-card">
    <div class="table-card-head">
      <span class="table-card-title">Store List</span>
    </div>
    <table class="dt">
      <thead>
        <tr>
          <th>Name</th>
          <th>Size</th>
          <th>Phone</th>
          <th>Email</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="c : ${customers}">
          <td><strong th:text="${c.name}"></strong></td>
          <td><span class="badge badge-blue" th:text="${c.size}"></span></td>
          <td th:text="${c.phone}"></td>
          <td th:text="${c.email}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(customers)}">
          <td colspan="4" style="text-align:center;padding:32px;color:var(--muted);">No stores yet. <a th:href="@{/customers/new}" style="color:var(--accent);">Add one.</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
