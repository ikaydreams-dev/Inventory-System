<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Issue</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>
<body class="section">
<div th:replace="fragments/nav :: navbar"></div>
<div class="container">
    <h1 class="title">Issue to Customer</h1>
    <form method="post" th:action="@{/issue}">
        <div class="field">
            <label class="label">Item</label>
            <div class="control">
                <div class="select is-fullwidth">
                    <select name="itemId" required>
                        <option th:each="i : ${items}" th:value="${i.id}" th:text="${i.name}"></option>
                    </select>
                </div>
            </div>
        </div>
        <div class="field">
            <label class="label">Customer</label>
            <div class="control">
                <div class="select is-fullwidth">
                    <select name="customerId" required>
                        <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.name}"></option>
                    </select>
                </div>
            </div>
        </div>
        <div class="field">
            <label class="label">Quantity</label>
            <div class="control">
                <input class="input" type="number" min="1" name="quantity" required>
            </div>
        </div>
        <div class="field">
            <label class="label">Reference</label>
            <div class="control">
                <input class="input" type="text" name="reference">
            </div>
        </div>
        <div class="field">
            <label class="label">Date</label>
            <div class="control">
                <input class="input" type="date" name="date">
            </div>
        </div>
        <div class="field is-grouped">
            <div class="control">
                <button class="button is-link" type="submit">Issue</button>
            </div>
            <div class="control">
                <a class="button is-light" href="/items">Cancel</a>
            </div>
        </div>
    </form>
</div>
</body>
</html>
