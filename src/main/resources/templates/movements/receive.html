<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receive Stock — StockBox</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="fragments/nav :: navbar"></div>
<div class="page-body">
  <div class="page-header">
    <div>
      <div class="page-title">Receive Stock</div>
      <div class="page-sub">Record incoming stock from a supplier</div>
    </div>
    <a class="btn btn-ghost" th:href="@{/items}">&#8592; Back to Items</a>
  </div>

  <div class="form-card">
    <form method="post" th:action="@{/receive}">
      <div class="form-row">
        <div class="form-group">
          <label class="fl">Item *</label>
          <select class="fi" name="itemId" required>
            <option value="">Select item…</option>
            <option th:each="i : ${items}" th:value="${i.id}" th:text="${i.name}"></option>
          </select>
        </div>
        <div class="form-group">
          <label class="fl">Supplier *</label>
          <select class="fi" name="supplierId" required>
            <option value="">Select supplier…</option>
            <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}"></option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="fl">Quantity *</label>
          <input class="fi" type="number" min="1" name="quantity" placeholder="e.g. 50" required>
        </div>
        <div class="form-group">
          <label class="fl">Date</label>
          <input class="fi" type="date" name="date">
        </div>
      </div>
      <div class="form-group">
        <label class="fl">Reference</label>
        <input class="fi" type="text" name="reference" placeholder="Purchase order or delivery note number">
      </div>
      <div class="form-actions">
        <button class="btn btn-success" type="submit">&#8595; Receive Stock</button>
        <a class="btn btn-ghost" th:href="@{/items}">Cancel</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
