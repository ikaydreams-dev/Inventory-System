<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>
<body class="section">
<div class="container" style="max-width: 600px;">
    <h1 class="title">Register</h1>

    <form th:action="@{/register}" th:object="${form}" method="post">
        <div class="field">
            <label class="label">Email</label>
            <div class="control">
                <input class="input" type="email" th:field="*{email}" placeholder="email@example.com" required>
            </div>
            <p class="help is-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>
        <div class="field">
            <label class="label">Full Name</label>
            <div class="control">
                <input class="input" type="text" th:field="*{fullName}" placeholder="Full Name" required>
            </div>
            <p class="help is-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
        </div>
        <div class="field">
            <label class="label">Password</label>
            <div class="control">
                <input class="input" type="password" th:field="*{password}" placeholder="Password" required>
            </div>
            <p class="help is-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="field is-grouped">
            <div class="control">
                <button class="button is-link" type="submit">Register</button>
            </div>
            <div class="control">
                <a class="button is-text" th:href="@{/login}">Back to login</a>
            </div>
        </div>
    </form>
</div>
</body>
</html>
