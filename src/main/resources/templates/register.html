<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — StockBox</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-box">
  <div class="auth-logo">
    <div class="auth-logo-mark">&#9712;</div>
    <div class="auth-logo-name">Stock<span>Box</span></div>
  </div>
  <div class="auth-title">Create your account</div>
  <div class="auth-sub">Get started with StockBox today</div>

  <form th:action="@{/register}" th:object="${form}" method="post">
    <div class="form-group">
      <label class="fl" for="email">Email address</label>
      <input class="fi" type="email" id="email" th:field="*{email}" placeholder="you@example.com" required autofocus>
      <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
    </div>
    <div class="form-group">
      <label class="fl" for="fullName">Full name</label>
      <input class="fi" type="text" id="fullName" th:field="*{fullName}" placeholder="Your full name" required>
      <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
    </div>
    <div class="form-group">
      <label class="fl" for="password">Password</label>
      <input class="fi" type="password" id="password" th:field="*{password}" placeholder="Choose a password" required>
      <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
    </div>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button class="btn btn-primary btn-full" type="submit" style="margin-top:8px;">Create account</button>
  </form>
  <div class="auth-footer">
    Already have an account? <a th:href="@{/login}">Sign in</a>
  </div>
</div>
</body>
</html>
