<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<aside class="sidebar" th:fragment="navbar">
  <a class="sidebar-brand" th:href="@{/}">
    <div class="sidebar-brand-icon">&#9712;</div>
    <span class="sidebar-brand-name">Stock<span>Box</span></span>
  </a>

  <nav style="flex:1;">
    <div class="sidebar-section-label">Main</div>
    <a class="sidebar-link" th:href="@{/}">
      <span class="sidebar-icon">&#8962;</span> Dashboard
    </a>
    <a class="sidebar-link" th:href="@{/items}">
      <span class="sidebar-icon">&#9741;</span> Items
    </a>
    <a class="sidebar-link" th:href="@{/categories}">
      <span class="sidebar-icon">&#9783;</span> Categories
    </a>

    <div class="sidebar-section-label">People</div>
    <a class="sidebar-link" th:href="@{/suppliers}">
      <span class="sidebar-icon">&#9954;</span> Suppliers
    </a>
    <a class="sidebar-link" th:href="@{/customers}">
      <span class="sidebar-icon">&#9749;</span> Stores
    </a>

    <div class="sidebar-section-label">Movements</div>
    <a class="sidebar-link" th:href="@{/receive}">
      <span class="sidebar-icon">&#8595;</span> Receive
    </a>
    <a class="sidebar-link" th:href="@{/issue}">
      <span class="sidebar-icon">&#8593;</span> Issue
    </a>

    <div class="sidebar-section-label">Reports</div>
    <a class="sidebar-link" th:href="@{/reports/summary}">
      <span class="sidebar-icon">&#9998;</span> Summary
    </a>
    <a class="sidebar-link" th:href="@{/analytics}">
      <span class="sidebar-icon">&#9656;</span> Analytics
    </a>
  </nav>

  <div class="sidebar-footer" sec:authorize="isAuthenticated()">
    <div class="sidebar-user">
      <div class="sidebar-avatar">
        <span sec:authentication="name" th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</span>
      </div>
      <span class="sidebar-username" sec:authentication="name">User</span>
    </div>
    <button class="btn btn-ghost btn-sm btn-full" onclick="document.getElementById('logoutModal').classList.add('open')">
      Sign out
    </button>
  </div>

  <div class="sidebar-footer" sec:authorize="!isAuthenticated()">
    <a class="btn btn-primary btn-sm btn-full" th:href="@{/login}">Sign in</a>
  </div>
</aside>

<button class="mobile-nav-btn" onclick="document.querySelector('.sidebar').classList.toggle('open')">&#9776;</button>

<script>
  (function() {
    var path = window.location.pathname;
    var links = document.querySelectorAll('.sidebar-link');
    var best = null, bestLen = 0;
    links.forEach(function(a) {
      var href = a.getAttribute('href');
      if (href === '/' ? path === '/' : path === href || path.startsWith(href + '/')) {
        if (href.length > bestLen) { best = a; bestLen = href.length; }
      }
    });
    if (best) best.classList.add('active');
  })();
</script>

<div id="logoutModal" class="modal-bg">
  <div class="modal-box">
    <div class="modal-title">Sign out</div>
    <div class="modal-body">Are you sure you want to sign out?</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="document.getElementById('logoutModal').classList.remove('open')">Cancel</button>
      <form th:action="@{/logout}" method="post" style="margin:0;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-danger">Sign out</button>
      </form>
    </div>
  </div>
</div>
</aside>
</body>
</html>
