<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav class="navbar" th:fragment="navbar">
  <div class="container">
    <div class="navbar-brand">
      <a class="navbar-item" th:href="@{/}">Inventory</a>
    </div>
    <div class="navbar-menu is-active">
      <div class="navbar-start">
        <a class="navbar-item" th:href="@{/}">Home</a>
        <a class="navbar-item" th:href="@{/items}">Items</a>
        <a class="navbar-item" th:href="@{/suppliers}">Suppliers</a>
        <a class="navbar-item" th:href="@{/categories}">Categories</a>
        <a class="navbar-item" th:href="@{/customers}">Customers</a>
        <a class="navbar-item" th:href="@{/receive}">Receive</a>
        <a class="navbar-item" th:href="@{/issue}">Issue</a>
        <a class="navbar-item" th:href="@{/reports/summary}">Reports</a>
        <a class="navbar-item" th:href="@{/analytics}">Analytics</a>
      </div>
      <div class="navbar-end">
        <div class="navbar-item" sec:authorize="!isAuthenticated()">
          <a class="navbar-item" th:href="@{/login}">Login</a>
          <a class="navbar-item" th:href="@{/register}">Register</a>
        </div>
        <div class="navbar-item" sec:authorize="isAuthenticated()">
          <span sec:authentication="name">User</span>
          <button type="button" class="button is-light" onclick="openLogoutModal()">Logout</button>
        </div>
      </div>
    </div>
  </div>
  <div id="logoutModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);align-items:center;justify-content:center;z-index:1000;">
    <div style="background:#fff;padding:1rem;border-radius:6px;width:90%;max-width:420px;">
      <h3 style="margin:0 0 .5rem 0;">Confirm Logout</h3>
      <p style="margin:0 0 1rem 0;">Are you sure you want to logout?</p>
      <div style="display:flex;gap:.5rem;justify-content:flex-end;">
        <form th:action="@{/logout}" method="post" style="margin:0;">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button type="submit" class="button is-danger">Logout</button>
        </form>
        <button type="button" class="button" onclick="closeLogoutModal()">Cancel</button>
      </div>
    </div>
  </div>
  <script>
    function openLogoutModal(){var m=document.getElementById('logoutModal');if(m){m.style.display='flex';}}
    function closeLogoutModal(){var m=document.getElementById('logoutModal');if(m){m.style.display='none';}}
  </script>
</nav>
</body>
</html>
